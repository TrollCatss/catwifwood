<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 128" width="64" height="128">
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a4a4d"/>
      <stop offset="38%" stop-color="#77777c"/>
      <stop offset="70%" stop-color="#5c5c60"/>
      <stop offset="100%" stop-color="#3b3b3e"/>
    </linearGradient>
  </defs>

  <!-- Stiff, upright tail: thick fluffy tip up top, tapering to a narrow base.
       Modelled on the tail in the source logo. -->
  <path
    d="M32 4
       C 45 4, 52 15, 51 30
       C 50 45, 45 62, 42 82
       C 40 98, 39 112, 38 124
       L 26 124
       C 25 112, 24 98, 22 82
       C 19 62, 14 45, 13 30
       C 12 15, 19 4, 32 4 Z"
    fill="url(#fur)"
    stroke="#2e2e31"
    stroke-width="2.5"
    stroke-linejoin="round"/>

  <!-- Ring banding, like the logo's tail. -->
  <path d="M15 34 C 26 30, 38 30, 50 34" stroke="#3a3a3d" stroke-width="4" fill="none" opacity="0.55" stroke-linecap="round"/>
  <path d="M17 52 C 28 48, 38 48, 48 52" stroke="#3a3a3d" stroke-width="4" fill="none" opacity="0.45" stroke-linecap="round"/>
  <path d="M20 70 C 29 67, 37 67, 45 70" stroke="#3a3a3d" stroke-width="3.5" fill="none" opacity="0.35" stroke-linecap="round"/>

  <!-- Highlight down the shaft to give it volume. -->
  <path d="M27 12 C 22 26, 24 50, 28 76 C 30 94, 31 110, 31 122"
        stroke="#9a9aa0" stroke-width="3.5" fill="none" opacity="0.5" stroke-linecap="round"/>
</svg>
